<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Juego de la mascota (relleno de pruebas)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b2448; color: #fff; font-family: sans-serif; }
      body { display: flex; align-items: center; justify-content: center; }
    </style>
  </head>
  <body>
    <p>Juego de la mascota (relleno de pruebas)</p>
    <script>
      // Herramienta de prueba (spec 013, CA-13): guarda en el DOM de esta página el último toque, en las
      // coordenadas del propio juego, y cuántos van. Sin postMessage: /pet y /games/play escuchan "message".
      (function () {
        function record(type, x, y) {
          var root = document.documentElement;
          root.dataset.lastPointer = JSON.stringify({ type: type, x: x, y: y });
          root.dataset.pointerCount = String(Number(root.dataset.pointerCount || 0) + 1);
        }
        window.addEventListener('pointerdown', function (e) { record('pointerdown', e.clientX, e.clientY); }, true);
        window.addEventListener('touchstart', function (e) {
          var t = e.touches[0];
          if (t) record('touchstart', t.clientX, t.clientY);
        }, true);
      })();
    </script>
  </body>
</html>
