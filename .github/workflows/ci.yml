name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Una corrida nueva del mismo PR (o rama) cancela la anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Los cuatro jobs son los checks que se marcan como obligatorios para el merge en
# GitHub (Settings -> Branches): "Lint, tipos y build", "Pruebas", "Auditoría de dependencias"
# y "Pruebas en navegador". No cambiarles el nombre sin cambiar la protección de `main`.
# Ningún job usa secretos de GitHub y ninguno tolera fallos.
jobs:
  verify:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valores públicos y ficticios: solo para que el build compile.
      # No se usa ningún secreto de GitHub.
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_PUBLIC_WS_URL: https://api.example.test/ws
      NEXT_PUBLIC_PET_GAME_URL: https://games.example.test
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ficticia-solo-para-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Caché del build de Next (recomendada por la guía de Next para CI). La clave
      # incluye el lockfile y el código fuente; si cambia el código se parte de la
      # caché más reciente del mismo lockfile.
      - name: Caché de .next/cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Instalar dependencias
        run: npm ci

      # El tope de avisos (.lint-max-warnings) nunca sube: se compara con el de la
      # rama destino, que hay que traer porque el checkout es superficial.
      - name: Traer la rama destino
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      # En un push a `main`, `origin/main` ya es el commit nuevo y el tope se compararía
      # consigo mismo: se trae el commit anterior al push (`github.event.before`, por
      # variable de entorno). Si no se puede traer (push forzado, rama nueva), el script usa
      # el respaldo documentado en CLAUDE.md y lo avisa; por eso no falla el paso.
      - name: Traer el commit anterior al push
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || echo "Aviso: no se pudo traer el commit anterior al push."

      # Falla con errores, con más avisos que el tope, con menos avisos que el tope
      # (hay que bajarlo) o con un tope mayor al de la rama destino (en un PR) o al del
      # commit anterior (en un push).
      - name: Lint (tope de avisos que solo baja)
        env:
          LINT_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: npm run lint:ci

      - name: Build
        run: npm run build

      # Después del build a propósito: `next build` genera los tipos de rutas en
      # .next/types, y solo con ellos `tsc` ve los mismos errores que el build.
      # Antes del build, tsc no los vería (falso verde).
      - name: Tipos
        run: npx tsc --noEmit

  tests:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas
        run: npm test

  # Auditoría de dependencias de producción (--omit=dev: lo de desarrollo no llega
  # al bundle ni al contenedor). Bloqueante: los avisos altos conocidos (`xlsx` y el
  # `postcss` anidado en Next) tienen excepción escrita, con motivo y fecha de revisión,
  # en security/audit-exceptions.json. Una excepción vencida, o un aviso alto nuevo
  # (incluso en esos paquetes), hace fallar el job. Si el registro de npm no responde
  # sale con código 2 y un mensaje distinto: reintentar la corrida.
  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoría con excepciones
        run: npm run audit:ci

  # Pruebas de navegador (spec 012, P-13): Playwright con Chromium contra el build `standalone` de la
  # app y una API simulada en loopback con datos ficticios. No usa la red externa ni secretos de GitHub.
  # `build:e2e` hace su propio build porque las NEXT_PUBLIC_* quedan fijas al compilar (P-3).
  e2e:
    name: Pruebas en navegador
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Caché de .next/cache (build de pruebas)
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Dependencias del sistema de Chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build de pruebas
        run: npm run build:e2e

      - name: Pruebas en navegador
        run: npm run test:e2e

      - name: Reporte (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
